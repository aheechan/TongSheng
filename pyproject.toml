[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tongsheng"
version = "1.0.5"
description = "TongSheng (同声) - real-time voice translation with your own cloned voice"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TongSheng contributors" }]
keywords = ["tts", "asr", "translation", "gpt-sovits", "voice-cloning", "windows"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
audio = ["sounddevice>=0.4.6"]
asr-zh = ["funasr>=1.0"]
asr-en = ["faster-whisper>=1.0"]
tts = ["torch>=2.1", "torchaudio>=2.1", "transformers>=4.40", "librosa>=0.10"]
all = [
  "PySide6>=6.6",
  "sounddevice>=0.4.6",
  "funasr>=1.0",
  "faster-whisper>=1.0",
  "torch>=2.1",
  "torchaudio>=2.1",
  "transformers>=4.40",
  "librosa>=0.10",
]
dev = ["pytest>=8.0"]

[project.scripts]
tongsheng = "tongsheng.__main__:main"

[tool.setuptools]
packages = ["tongsheng", "tongsheng.audio", "tongsheng.asr", "tongsheng.llm",
            "tongsheng.correct", "tongsheng.translate", "tongsheng.tts", "tongsheng.ui"]

[tool.setuptools.package-data]
tongsheng = ["assets/*", "prompts/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
